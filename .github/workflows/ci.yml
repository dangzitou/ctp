name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './apps/api[dev]'

      - name: Install Web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Run API tests
        run: python -m pytest apps/api/tests

      - name: Build Web app
        run: pnpm --dir apps/web build
